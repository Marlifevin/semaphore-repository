---
- hosts: "*"
  vars:
    ansible_python_interpreter: /usr/bin/python3
    # In Semaphore als Environment-Variable hinterlegen, nicht hardcoden:
    #n8n_webhook_url: "{{ n8n_webhook_url }}"
  become: yes
  tasks:

    # --- Erreichbarkeitscheck (unverändert) ---------------------------------
    - name: Prüfe HTTP-Zugriff auf google.com
      uri:
        url: https://www.google.com
        method: GET
        return_content: no
        status_code: 200
        timeout: 5
      register: google_check
      ignore_errors: yes

    - name: Fehler anzeigen wenn google.com nicht erreichbar ist
      fail:
        msg: "google.com ist nicht erreichbar!"
      when: google_check.failed

    # --- Paket-Updates (unverändert) ----------------------------------------
    - name: apt dist update
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Check that the reboot-required exists
      stat:
        path: /var/run/reboot-required
      register: reboot_check

    - name: "Require Reboot?"
      debug:
        msg: "Reboot required"
      when: reboot_check.stat.exists

    # --- NEU: Prüfung auf neue Distributions-Version ------------------------

    # Ubuntu: nutzt das offizielle Release-Upgrade-Tool im Check-Modus
    - name: "[Ubuntu] Prüfe auf neue Release-Version"
      command: do-release-upgrade -c
      register: ubuntu_release_check
      changed_when: false
      failed_when: false
      when: ansible_distribution == "Ubuntu"

    - name: "[Ubuntu] Setze Fakten"
      set_fact:
        new_release_available: "{{ 'New release' in (ubuntu_release_check.stdout | default('')) }}"
        new_release_info: "{{ ubuntu_release_check.stdout | default('') }}"
      when: ansible_distribution == "Ubuntu"

    # Debian / Raspberry Pi OS: kein offizielles CLI-Tool, daher Codename
    # der aktuellen "stable"-Suite von deb.debian.org abfragen und mit dem
    # lokal installierten Codename vergleichen
    - name: "[Debian] Ermittle aktuellen Codename"
      set_fact:
        local_codename: "{{ ansible_distribution_release }}"
      when: ansible_distribution == "Debian"

    - name: "[Debian] Frage aktuellen stable-Codename von deb.debian.org ab"
      uri:
        url: https://deb.debian.org/debian/dists/stable/Release
        return_content: yes
        timeout: 10
      register: debian_release_file
      when: ansible_distribution == "Debian"
      ignore_errors: yes

    - name: "[Debian] Setze Fakten"
      set_fact:
        debian_stable_codename: "{{ debian_release_file.content | regex_search('Codename:\\s*(\\S+)', '\\1') | first }}"
      when:
        - ansible_distribution == "Debian"
        - debian_release_file is succeeded

    - name: "[Debian] Vergleiche Codenames"
      set_fact:
        new_release_available: "{{ debian_stable_codename is defined and debian_stable_codename != local_codename }}"
        new_release_info: "Aktuell: {{ local_codename }} / Verfügbar: {{ debian_stable_codename | default('unbekannt') }}"
      when: ansible_distribution == "Debian"

    # --- Benachrichtigung über n8n-Webhook -----------------------------------
    - name: Sende Benachrichtigung an n8n, wenn Reboot nötig oder neue Version verfügbar
      uri:
        url: "{{ n8n_webhook_url }}"
        method: POST
        body_format: json
        body:
          hostname: "{{ inventory_hostname }}"
          distribution: "{{ ansible_distribution }}"
          current_version: "{{ ansible_distribution_version }}"
          current_codename: "{{ ansible_distribution_release }}"
          reboot_required: "{{ reboot_check.stat.exists }}"
          new_release_available: "{{ new_release_available | default(false) }}"
          new_release_info: "{{ new_release_info | default('') }}"
        status_code: [200, 201, 202, 204]
        timeout: 10
      when: >
        reboot_check.stat.exists or
        (new_release_available | default(false))
      ignore_errors: yes
